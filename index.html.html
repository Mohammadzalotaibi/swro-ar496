<style>
:root{--bg1:#e9f2f9;--bg2:#bcd3e6;--pn:rgba(255,255,255,.9);--tx:#0e2233;--mu:#4d6477;--ac:#0a7ea4;--bd:rgba(14,34,51,.16);--chip:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#07151f;--bg2:#0d2b40;--pn:rgba(10,24,36,.9);--tx:#e6f1f8;--mu:#93aabb;--ac:#3cc8f0;--bd:rgba(230,241,248,.16);--chip:#0f2638}}
:root[data-theme="dark"]{--bg1:#07151f;--bg2:#0d2b40;--pn:rgba(10,24,36,.9);--tx:#e6f1f8;--mu:#93aabb;--ac:#3cc8f0;--bd:rgba(230,241,248,.16);--chip:#0f2638}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,Tajawal,system-ui,sans-serif;color:var(--tx);background:linear-gradient(var(--bg1),var(--bg2))}
[dir=rtl] body,[dir=rtl] button{font-family:Tajawal,Inter,system-ui,sans-serif}
body.ar{background:#000}
#vid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
body.ar #vid{display:block}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px;display:flex;gap:8px;align-items:center;z-index:5;pointer-events:none}
.top>*{pointer-events:auto}
.ttl{font-weight:700;font-size:14px;background:var(--pn);border:1px solid var(--bd);padding:7px 11px;border-radius:12px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:7px 11px;cursor:pointer;font-size:13px;backdrop-filter:blur(8px)}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:0;right:0;display:flex;gap:6px;overflow-x:auto;padding:4px 10px;z-index:5;scrollbar-width:none}
.chips button{white-space:nowrap;background:var(--chip);flex:none;font-size:12px;padding:6px 10px}
.sheet{position:fixed;left:0;right:0;bottom:env(safe-area-inset-bottom,0px);max-height:46%;overflow:auto;background:var(--pn);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;padding:14px 14px 18px;z-index:6;backdrop-filter:blur(12px)}
.sheet h2{margin:0 0 2px;font-size:17px}
.tag{display:inline-block;font-size:11px;color:var(--ac);border:1px solid var(--ac);border-radius:99px;padding:1px 8px;margin-bottom:6px;direction:ltr}
.sheet p{margin:4px 0 10px;font-size:13px;line-height:1.55;color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.st{border:1px solid var(--bd);border-radius:12px;padding:8px 10px}
.st b{display:block;font-size:15px;direction:ltr;unicode-bidi:plaintext}
.st span{font-size:11px;color:var(--mu)}
.src{font-size:11px;color:var(--mu);margin-top:8px}
.bar{height:20px;border-radius:6px;background:var(--ac);color:#fff;font-size:12px;display:flex;align-items:center;padding:0 8px;transition:width .6s;white-space:nowrap;direction:ltr;margin:3px 0 10px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 48%);font-size:11px;color:var(--mu);z-index:4;background:var(--pn);border-radius:99px;padding:3px 10px;border:1px solid var(--bd);white-space:nowrap}
.ctl{position:fixed;inset-inline-end:10px;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;gap:6px;z-index:5}.ctl button{font-size:12px;padding:7px 10px;text-align:start}.xb{float:inline-end;margin-inline-start:8px;background:#b3261e;color:#fff;border-color:#b3261e}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 100px);left:50%;transform:translateX(-50%);background:#b3261e;color:#fff;border-radius:10px;padding:8px 12px;font-size:12px;z-index:9;display:none;max-width:90%}
</style>

var seaMeshes=[];
function mkSea(w,d,x,z){var m=new THREE.Mesh(new THREE.PlaneGeometry(w,d,26,26),new THREE.MeshStandardMaterial({color:0x1b7fb5,transparent:true,opacity:.88,roughness:.25,metalness:.2,flatShading:true}));m.rotation.x=-Math.PI/2;m.position.set(x,-.12,z);root.add(m);seaMeshes.push(m)}
mkSea(11.5,25,-16.25,-3.5);mkSea(32.5,10.6,5.75,-10.7);
function waves(t){seaMeshes.forEach(function(m){var a=m.geometry.attributes.position;for(var i=0;i<a.count;i++){var x=a.getX(i),y=a.getY(i);a.setZ(i,Math.sin(x*.7+t*1.6)*.07+Math.cos(y*.8+t*1.2)*.06)}a.needsUpdate=true})}
root.add(cyl(.12,3,0x6f8aa5,-11.4,.2,0,"x"));
var seed=7;function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
for(var cx=0;cx<4;cx++)for(var cz=0;cz<5;cz++){var bh=.6+rnd()*2.4,bw=.9+rnd()*.4,bx=12.8+cx*1.9,bz=-3.8+cz*2.2;var bd=box(bw,bh,bw,0xb9c6d2,bx,bh/2-.06,bz);bd.material.color.offsetHSL(0,0,(rnd()-.5)*.12);root.add(bd);for(var r=1;r<bh/.5;r++)root.add(box(bw+.03,.07,bw*.55,0xffe29a,bx,r*.5,bz,{emissive:0xffd36b,emissiveIntensity:.6}))}

tag("Sea · البحر",-16,.9,0);tag("Sea · البحر",5,.9,-10);tag("City · المدينة",16.5,3.8,.6);
/* ---------- pipes and particles ---------- */
var Y=.55;
function P(a){return a.map(function(p){return new THREE.Vector3(p[0],Y,p[1])})}
var paths=[
 {id:"feed",c:0x3aa0ff,n:28,pts:P([[-12.2,0],[-9,0],[-6.6,0],[-4.6,0],[-3.8,0]])},
 {id:"a1",c:0x3aa0ff,n:10,nOff:28,pts:P([[-3.8,0],[-3.8,1.3],[-3.2,1.3]])},
 {id:"a2",c:0xff5a4a,n:10,nOff:28,pts:P([[-2.0,1.3],[-1.4,1.3],[-1.4,0],[-.2,0]])},
 {id:"b1",c:0x3aa0ff,n:18,pts:P([[-3.8,0],[-3.8,-1.3],[-3.4,-1.3]])},
 {id:"b2",c:0xff5a4a,n:18,pts:P([[-1.8,-1.3],[-.5,-1.3],[-.5,0],[-.2,0]])},
 {id:"perm",c:0x38e8d0,n:10,pts:P([[2.9,.5],[4.2,.5],[4.2,0],[4.4,0],[5.3,0],[6.1,0],[7.9,0],[8.2,0],[9.8,0],[11.8,0]])},
 {id:"bh",c:0xff9d3a,n:17,pts:P([[2.9,-.5],[2.9,-2.2],[-2.35,-2.2],[-2.35,-1.65]])},
 {id:"bl",c:0xc77d2c,n:17,pts:P([[-2.85,-1.65],[-2.85,-6.2]])}
];
var UP=new THREE.Vector3(0,1,0);
paths.forEach(function(p){
 var len=[],tot=0,i;for(i=0;i<p.pts.length-1;i++){var d=p.pts[i+1].distanceTo(p.pts[i]);len.push(d);tot+=d;
  var m=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,d,8),new THREE.MeshBasicMaterial({color:p.c,transparent:true,opacity:.45}));
  var dir=p.pts[i+1].clone().sub(p.pts[i]).normalize();m.position.copy(p.pts[i].clone().add(p.pts[i+1]).multiplyScalar(.5));m.quaternion.setFromUnitVectors(UP,dir);root.add(m);p.mesh=(p.mesh||[]);p.mesh.push(m)}
 p.len=len;p.tot=tot;var N=Math.max(p.n,28);
 p.geo=new THREE.BufferGeometry();p.geo.setAttribute("position",new THREE.BufferAttribute(new Float32Array(N*3),3));
 p.pt=new THREE.Points(p.geo,new THREE.PointsMaterial({color:p.c,size:.16,sizeAttenuation:true}));p.pt.frustumCulled=false;root.add(p.pt);
});
function curN(p){if(p.id==="a1"||p.id==="a2")return pxOn?10:28;if(p.id==="b1"||p.id==="b2")return pxOn?18:0;return p.n}
function posOn(p,s,out){s=((s%p.tot)+p.tot)%p.tot;for(var i=0;i<p.len.length;i++){if(s<=p.len[i]){var t=s/p.len[i];out.lerpVectors(p.pts[i],p.pts[i+1],t);return}s-=p.len[i]}}
var tmp=new THREE.Vector3();
function flow(time){paths.forEach(function(p){var n=curN(p),a=p.geo.attributes.position;
 for(var i=0;i<a.count;i++){if(i<n){posOn(p,(i/n)*p.tot+time*1.1,tmp);a.setXYZ(i,tmp.x,tmp.y+.09,tmp.z)}else a.setXYZ(i,0,-50,0)}
 a.needsUpdate=true;p.mesh.forEach(function(m){m.visible=curN(p)>0})})}

/* ---------- camera / interaction ---------- */
var th=.7,ph=.9,dist=28,tgt=new THREE.Vector3(2,0,-1.5),tgtGoal=tgt.clone();
var arScale=.1,hasGyro=false,needPlace=false,dev={a:0,b:0,g:0},stream=null,spin=0;
function lookCam(){var s=Math.sin(ph);cam.position.set(tgt.x+dist*s*Math.sin(th),tgt.y+dist*Math.cos(ph),tgt.z+dist*s*Math.cos(th));cam.lookAt(tgt)}
var zee=new THREE.Vector3(0,0,1),eu=new THREE.Euler(),q0=new THREE.Quaternion(),q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
function gyroQ(q){var o=((screen.orientation&&screen.orientation.angle)||0)*Math.PI/180,D=Math.PI/180;eu.set(dev.b*D,dev.a*D,-dev.g*D,"YXZ");q.setFromEuler(eu);q.multiply(q1);q.multiply(q0.setFromAxisAngle(zee,-o))}
function placeAR(){var f=new THREE.Vector3(0,0,-1).applyQuaternion(cam.quaternion);f.y=0;if(f.lengthSq()<1e-4)f.set(0,0,-1);f.normalize();var r=new THREE.Vector3().crossVectors(f,UP);root.position.set(f.x*3,-1.1,f.z*3);root.rotation.y=Math.atan2(-r.z,r.x);root.scale.setScalar(arScale)}
window.addEventListener("deviceorientation",function(e){if(e.alpha==null)return;hasGyro=true;dev.a=e.alpha;dev.b=e.beta;dev.g=e.gamma;if(needPlace&&mode==="ar"){gyroQ(cam.quaternion);placeAR();needPlace=false}});

var ptr={},pd=0,moved=0,down=null;
var cv=renderer.domElement;
cv.addEventListener("pointerdown",function(e){cv.setPointerCapture(e.pointerId);distGoal=null;phGoal=null;ptr[e.pointerId]=[e.clientX,e.clientY];moved=0;down=[e.clientX,e.clientY];pd=pinchD()});
cv.addEventListener("pointermove",function(e){var p=ptr[e.pointerId];if(!p)return;var dx=e.clientX-p[0],dy=e.clientY-p[1];ptr[e.pointerId]=[e.clientX,e.clientY];moved+=Math.abs(dx)+Math.abs(dy);var n=Object.keys(ptr).length;
 if(n===2){var d=pinchD();if(pd){var k=d/pd;if(mode==="ar"){arScale=Math.min(.6,Math.max(.04,arScale*k));root.scale.setScalar(arScale)}else dist=Math.min(40,Math.max(4,dist/k))}pd=d}
 else if(mode==="ar"){root.rotation.y+=dx*.01}else{th-=dx*.008;ph=Math.min(1.5,Math.max(.25,ph-dy*.006))}});
function end(e){delete ptr[e.pointerId];pd=0;if(moved<8&&down&&Object.keys(ptr).length===0)pick(e.clientX,e.clientY)}
cv.addEventListener("pointerup",end);cv.addEventListener("pointercancel",function(e){delete ptr[e.pointerId]});
cv.addEventListener("wheel",function(e){distGoal=null;dist=Math.min(40,Math.max(4,dist*(1+e.deltaY*.001)))},{passive:true});
function pinchD(){var k=Object.keys(ptr);if(k.length<2)return 0;var a=ptr[k[0]],b=ptr[k[1]];return Math.hypot(a[0]-b[0],a[1]-b[1])}
var ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(x,y){mv.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(mv,cam);var hit=ray.intersectObjects(groups.filter(Boolean),true)[0];if(hit){var o=hit.object;while(o&&o.userData.id===undefined)o=o.parent;if(o)select(o.userData.id)}}

function glow(i,on){var g=groups[i];if(!g)return;g.traverse(function(o){if(o.material&&o.material.emissive&&!o.isSprite&&o.geometry&&o.geometry.type!=="TorusGeometry"){o.material.emissive.setHex(on?0x1b8fb5:0x000000);o.material.emissiveIntensity=on?.55:0}})}

 var u=UI[lang];document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";

  s='<button class="xb" id="xb">'+u.ex+'</button><h2>'+T(ENERGY.n)+'</h2><p>'+T(ENERGY.d)+'</p><div style="display:flex;gap:6px;margin-bottom:10px"><button class="'+(a?"on":"")+'" id="px1">PX ON</button><button class="'+(!a?"on":"")+'" id="px0">PX OFF</button></div>'+
  '<div class="grid" style="grid-template-columns:1fr">'+
  '<div class="st"><span>'+(lang==="en"?"Electrical power of the RO section, per train (kW)":"القدرة الكهربائية لقسم التناضح العكسي لكل خط (kW)")+'</span><div class="bar" style="width:'+(a?39.3:100)+'%">'+(a?"245.5":"625.0")+' kW</div>'+
  '<span>'+(lang==="en"?"Specific energy of the RO section (kWh/m³ permeate)":"الطاقة النوعية لقسم التناضح العكسي (kWh/m³ منتَج)")+'</span><div class="bar" style="width:'+(a?39.3:100)+'%">'+(a?"2.31":"5.88")+' kWh/m³</div>'+
  '<span>'+(lang==="en"?"High-pressure pump flow (m³/h)":"تدفق مضخة الضغط العالي (m³/h)")+'</span><div class="bar" style="width:'+(a?37.5:100)+'%">'+(a?"106.29":"283.45")+' m³/h</div></div></div>'+
  '<p class="src">'+(lang==="en"?"With the PX the RO section power falls by 60.7% (625.0 → 245.5 kW per train). Source: §2.2.12":"مع مبادل الضغط تنخفض قدرة قسم التناضح العكسي بنسبة 60.7% (625.0 ← 245.5 kW لكل خط). المصدر: §2.2.12")+'</p>';
 }else if(sel<0){s='<h2>'+T(OV.name)+'</h2><span class="tag">'+OV.code+'</span><p>'+T(OV.d)+'</p><div class="grid">'+OV.s.map(stat).join("")+'</div><p class="src">'+u.src+': '+OV.src+'</p>'}
 else{var x=U[sel];s='<button class="xb" id="xb">'+u.ex+'</button><h2>'+T(x.n)+'</h2><span class="tag">'+x.c+'</span><p>'+T(x.d)+'</p><div class="grid">'+x.s.map(stat).join("")+'</div><p class="src">'+u.src+': '+x.src+'</p>'}

}

 mode="ar";document.body.classList.add("ar");floor.visible=false;root.scale.setScalar(arScale);cam.position.set(0,0,0);cam.quaternion.identity();needPlace=true;

var clk=new THREE.Clock(),at=0;
(function loop(){requestAnimationFrame(loop);var dt=clk.getDelta();if(!paused)at+=dt;flow(at*.9);waves(at);var idle=!Object.keys(ptr).length;
 if(mode==="ar"){if(hasGyro&&!needPlace)gyroQ(cam.quaternion);if(rot&&!paused&&idle)root.rotation.y+=.004}
 else{tgt.lerp(tgtGoal,.08);if(distGoal!==null)dist+=(distGoal-dist)*.06;if(phGoal!==null)ph+=(phGoal-ph)*.06;if(rot&&!paused&&idle)th+=.003;lookCam()}
 renderer.render(scene,cam)})();
render();
})();
